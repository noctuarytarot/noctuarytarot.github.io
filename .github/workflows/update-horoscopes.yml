name: Update horoscopes
on:
  schedule:
    # Times are UTC. Roughly spread across the day (GitHub may delay
    # scheduled runs by a few minutes during high load).
    - cron: '0 5 * * *'   # ~06:00 CEST / 05:00 CET
    - cron: '0 12 * * *'  # ~14:00 CEST / 13:00 CET
    - cron: '0 20 * * *'  # ~22:00 CEST / 21:00 CET
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start LibreTranslate
        run: |
          docker run -d -p 5000:5000 --name libretranslate \
            libretranslate/libretranslate --load-only en,cs
      - name: Fetch fresh horoscopes
        run: node update-horoscopes.js
      - name: Debug LibreTranslate on failure
        if: failure()
        run: docker logs libretranslate || true
      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add horoscopes.json
          git diff --cached --quiet || git commit -m "chore: auto-update horoscopes.json"
          git push
