<style>
  :root {
    --bg-color-1: #1a0733;

  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;

    padding: 28px 16px calc(40px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  button { font-family: inherit; }

  /* twinkling starfield */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 88% 22%, #fff 100%, transparent),
      radial-gradient(1px 1px at 80% 45%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 35% 70%, #fff 100%, transparent),
      radial-gradient(1px 1px at 90% 80%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 10% 85%, #fff 100%, transparent),
      radial-gradient(1px 1px at 50% 55%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 75% 65%, #fff 100%, transparent),
      radial-gradient(1px 1px at 25% 15%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 55% 8%, #fff 100%, transparent),
      radial-gradient(1px 1px at 5% 50%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 95% 60%, #fff 100%, transparent),
      radial-gradient(1px 1px at 42% 90%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 15% 5%, #fff 100%, transparent),
      radial-gradient(1px 1px at 68% 35%, #fff 100%, transparent),
      radial-gradient(1.5px 1.5px at 30% 92%, #fff 100%, transparent);
    background-size: 100% 100%;
    opacity: 0.55;
    animation: twinkle 4.5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.25; } 100% { opacity: 0.7; } }

  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.25; z-index: 0; animation: floatBlobs 22s ease-in-out infinite; pointer-events: none; will-change: transform; transform: translateZ(0); }
  .blob-1 { width: 280px; height: 280px; background: var(--accent-glow); top: -8%; left: -10%; }
  .blob-2 { width: 320px; height: 320px; background: var(--accent-color); bottom: -12%; right: -10%; animation-delay: -6s; animation-duration: 26s; }
  @keyframes floatBlobs { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(30px, -25px); } }

  header { position: relative; z-index: 1; max-width: 640px; margin-bottom: 22px; }
  h1 {
    font-size: clamp(20px, 6vw, 26px); letter-spacing: clamp(1.5px, 0.8vw, 3px); margin: 6px 0 4px;
    color: var(--accent-color); text-shadow: 0 0 12px var(--accent-color);
    white-space: nowrap;
  }
  .subtitle {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px;
    opacity: 0.8; margin: 0;
  }
  .current-month {
    font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1.5px;
    color: var(--accent-color); opacity: 0.75; margin: 10px 0 0; text-transform: uppercase;
  }

  /* zodiac grid */
  .sign-grid {
    position: relative; z-index: 1; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px; max-width: 900px; width: 100%;
  }
  .sign-card {
    background: var(--card-bg-1); border: 1px solid rgba(212,175,55,0.4); border-radius: 14px;
    padding: 18px 12px 16px; cursor: pointer; transition: 0.2s;
    box-shadow: 0 0 18px rgba(139,47,224,0.15);
  }
  .sign-card:hover, .sign-card.active {
    border-color: var(--accent-color); box-shadow: 0 0 22px rgba(212,175,55,0.35);
    transform: translateY(-2px);
  }
  .sign-symbol { font-size: 30px; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-color); }
  .sign-name-cz { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; margin-top: 6px; }
  .sign-name-en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; opacity: 0.55; margin-top: 2px; }

  /* horoscope panel */
  .horoscope-panel {
    position: relative; z-index: 1; max-width: 640px; width: 100%;
    margin-top: 26px; background: var(--card-bg-1); border: 1px solid var(--accent-color);
    border-radius: 14px; padding: 22px 20px; box-shadow: 0 0 30px rgba(212,175,55,0.25);
    display: none; text-align: left;
  }
  .horoscope-panel.visible { display: block; }
  .horoscope-panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .horoscope-panel-symbol { font-size: 26px; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-color); }
  .horoscope-panel-title { font-size: 15px; letter-spacing: 1.5px; color: var(--accent-color); }
  .horoscope-panel-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; opacity: 0.6; margin-top: 2px; }
  .horoscope-panel-text {
    font-family: 'Cormorant Garamond', serif; font-size: 17px; line-height: 1.65; opacity: 0.95;
  }
  .horoscope-panel-loading, .horoscope-panel-error {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; opacity: 0.7;
  }
  .loading-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 14px 0 8px;
  }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(212,175,55,0.22); border-top-color: var(--accent-color);
    animation: spin 0.85s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-percent {
    font-family: 'Orbitron', sans-serif; font-size: 15px; letter-spacing: 1px; color: var(--accent-color);
  }
  .loading-label {

  .horoscope-panel-note {

  footer {

  .site-nav-back a:hover { opacity: 1; text-shadow: 0 0 8px var(--accent-color); }

<script>
(function () {
  var SIGNS = [
    { en: 'aries', cz: 'Beran', symbol: '♈' },
    { en: 'taurus', cz: 'Býk', symbol: '♉' },
    { en: 'gemini', cz: 'Blíženci', symbol: '♊' },
    { en: 'cancer', cz: 'Rak', symbol: '♋' },
    { en: 'leo', cz: 'Lev', symbol: '♌' },
    { en: 'virgo', cz: 'Panna', symbol: '♍' },
    { en: 'libra', cz: 'Váhy', symbol: '♎' },
    { en: 'scorpio', cz: 'Štír', symbol: '♏' },
    { en: 'sagittarius', cz: 'Střelec', symbol: '♐' },
    { en: 'capricorn', cz: 'Kozoroh', symbol: '♑' },
    { en: 'aquarius', cz: 'Vodnář', symbol: '♒' },
    { en: 'pisces', cz: 'Ryby', symbol: '♓' }
  ];

  var PERIOD = 'monthly';

  var MONTHS_GENITIVE = ['leden', 'únor', 'březen', 'duben', 'květen', 'červen', 'červenec', 'srpen', 'září', 'říjen', 'listopad', 'prosinec'];

  function currentMonthName() {
    var d = new Date();
    return MONTHS_GENITIVE[d.getMonth()] + ' ' + d.getFullYear();
  }

  var PERIOD_LABEL = 'Horoskop na měsíc ' + currentMonthName();

  var monthEl = document.getElementById('current-month');
  if (monthEl) monthEl.textContent = 'Zobrazen horoskop na měsíc ' + currentMonthName();

  var grid = document.getElementById('sign-grid');
  var panel = document.getElementById('horoscope-panel');
  var panelSymbol = document.getElementById('panel-symbol');
  var panelTitle = document.getElementById('panel-title');
  var panelSub = document.getElementById('panel-sub');
  var panelBody = document.getElementById('panel-body');

  var currentSign = null;
  var cache = {}; // key: sign|date -> text
  var requestSeq = 0; // guards against a stale/duplicate request overwriting a newer result
  var progressTimer = null;

  function startLoadingUI() {
    if (progressTimer) clearInterval(progressTimer);
    var pct = 0;
    panelBody.innerHTML =
      '<div class="loading-wrap">' +
        '<div class="spinner"></div>' +
        '<div class="loading-percent" id="loading-percent">0%</div>' +
        '<div class="loading-label">Čtu hvězdy…</div>' +
      '</div>';
    var pctEl = document.getElementById('loading-percent');
    progressTimer = setInterval(function () {
      // Blíží se k 90 % a dokončení nikdy nepředstírá, dokud se fetch
      // opravdu nevrátí — posledních 10 % doplní až úspěšná odpověď.
      pct += Math.max(1, (90 - pct) * 0.12);
      if (pct > 90) pct = 90;
      if (pctEl) pctEl.textContent = Math.round(pct) + '%';
    }, 200);
  }

  function stopLoadingUI() {
    if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
  }

  SIGNS.forEach(function (s) {
    var card = document.createElement('div');
    card.className = 'sign-card';
    card.dataset.sign = s.en;
    card.innerHTML =
      '<div class="sign-symbol">' + s.symbol + '</div>' +
      '<div class="sign-name-cz">' + s.cz.toUpperCase() + '</div>' +
      '<div class="sign-name-en">' + s.en + '</div>';
    card.addEventListener('click', function () {
      selectSign(s);
    });
    grid.appendChild(card);
  });

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function selectSign(s) {
    currentSign = s;
    document.querySelectorAll('.sign-card').forEach(function (c) {
      c.classList.toggle('active', c.dataset.sign === s.en);
    });

    panel.classList.add('visible');
    panelSymbol.textContent = s.symbol;
    panelTitle.textContent = s.cz.toUpperCase();
    panelSub.textContent = PERIOD_LABEL;

    var cacheKey = s.en + '|' + todayKey();

    // Every call gets its own sequence number. If a newer call starts before
    // this one's fetch resolves, its result is discarded instead of
    // overwriting whatever the newer call already rendered (this is what
    // caused the "shows briefly, then reverts to loading/error" symptom —
    // a slower, stale request finishing after a faster/newer one).
    var mySeq = ++requestSeq;

    if (cache[cacheKey]) {
      renderText(cache[cacheKey]);
      return;
    }

    startLoadingUI();

    fetchHoroscopeText(PERIOD, s.en)
      .then(function (text) {
        if (mySeq !== requestSeq) return null; // a newer request has already taken over
        return { text: text };
      })
      .then(function (result) {
        if (!result || mySeq !== requestSeq) return; // a newer request has already taken over
        stopLoadingUI();
        cache[cacheKey] = result;
        renderText(result);
      })
      .catch(function (err) {
        if (mySeq !== requestSeq) return; // a newer request has already taken over
        stopLoadingUI();
        console.error('Horoskop se nepodařilo načíst ze žádného zdroje:', err);
        panelBody.innerHTML =
          '<div class="horoscope-panel-error">Tento horoskop ještě není připravený — zkus to prosím později znovu.</div>';
      });
  }

  var horoscopesDataPromise = null;

  // Načte statický horoscopes.json vygenerovaný GitHub Actions workflow
  // (scripts/update-horoscopes.js), který se aktualizuje 3x denně. Výsledek
  // se cachuje po dobu života stránky, aby se při přepínání znamení
  // znovu nestahoval.
  function getHoroscopesData() {
    if (!horoscopesDataPromise) {
      horoscopesDataPromise = fetch('horoscopes.json', { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('horoscopes.json bad response: ' + res.status);
          return res.json();
        })
        .catch(function (err) {
          horoscopesDataPromise = null; // umožní zkusit to znovu
          throw err;
        });
    }
    return horoscopesDataPromise;
  }

  function fetchHoroscopeText(period, sign) {
    return getHoroscopesData().then(function (data) {
      var text = data && data.signs && data.signs[sign];
      if (!text) throw new Error('pro znamení zatím není horoskop v cache: ' + sign);
      return text;
    });
  }


  function renderText(result) {
    var note = 'Horoskop je automaticky přeložen ze zahraničního zdroje a aktualizuje se 3× denně.';
    panelBody.innerHTML =
      '<div class="horoscope-panel-text">' + result.text + '</div>' +
      '<div class="horoscope-panel-note">' + note + '</div>';
  }
})();
</script>
