      radial-gradient(1.5px 1.5px at 75% 65%, #fff 100%, transparent),

  @keyframes twinkle { 0% { opacity: 0.25; } 100% { opacity: 0.7; } }

  .blob { position: fixed; border-radius: 50%; filter: blur(90px); opacity: 0.25; z-index: 0; animation: floatBlobs 22s ease-in-out infinite; pointer-events: none; will-change: transform; transform: translateZ(0); }

  /* zodiac grid */

    position: relative; z-index: 1; display: grid;

  .sign-card {

  .sign-symbol { font-size: 30px; color: var(--accent-color); text-shadow: 0 0 10px var(--accent-color); }
  .sign-name-cz { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px; margin-top: 6px; }
  .sign-name-en { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; opacity: 0.55; margin-top: 2px; }

  /* horoscope panel */

</footer>

<script>
(function () {
  var SIGNS = [
    { en: 'aries', cz: 'Beran', symbol: '♈' },
    { en: 'taurus', cz: 'Býk', symbol: '♉' },
    { en: 'gemini', cz: 'Blíženci', symbol: '♊' },
    { en: 'cancer', cz: 'Rak', symbol: '♋' },
    { en: 'leo', cz: 'Lev', symbol: '♌' },
    { en: 'virgo', cz: 'Panna', symbol: '♍' },
    { en: 'libra', cz: 'Váhy', symbol: '♎' },
    { en: 'scorpio', cz: 'Štír', symbol: '♏' },
    { en: 'sagittarius', cz: 'Střelec', symbol: '♐' },
    { en: 'capricorn', cz: 'Kozoroh', symbol: '♑' },
    { en: 'aquarius', cz: 'Vodnář', symbol: '♒' },
    { en: 'pisces', cz: 'Ryby', symbol: '♓' }
  ];

  var PERIOD_LABEL = { daily: 'Dnešní horoskop', weekly: 'Horoskop na tento týden', monthly: 'Horoskop na tento měsíc' };

  var grid = document.getElementById('sign-grid');
  var panel = document.getElementById('horoscope-panel');
  var panelSymbol = document.getElementById('panel-symbol');
  var panelTitle = document.getElementById('panel-title');
  var panelSub = document.getElementById('panel-sub');
  var panelBody = document.getElementById('panel-body');

  var currentPeriod = 'daily';
  var currentSign = null;
  var cache = {}; // key: period|sign|date -> text
  var requestSeq = 0; // guards against a stale/duplicate request overwriting a newer result

  SIGNS.forEach(function (s) {
    var card = document.createElement('div');
    card.className = 'sign-card';
    card.dataset.sign = s.en;
    card.innerHTML =
      '<div class="sign-symbol">' + s.symbol + '</div>' +
      '<div class="sign-name-cz">' + s.cz.toUpperCase() + '</div>' +
      '<div class="sign-name-en">' + s.en + '</div>';
    card.addEventListener('click', function () {
      selectSign(s);
    });
    grid.appendChild(card);
  });

  document.querySelectorAll('.period-tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.period-tab').forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      currentPeriod = tab.dataset.period;
      if (currentSign) selectSign(currentSign);
    });
  });

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function selectSign(s) {
    currentSign = s;
    document.querySelectorAll('.sign-card').forEach(function (c) {
      c.classList.toggle('active', c.dataset.sign === s.en);
    });

    panel.classList.add('visible');
    panelSymbol.textContent = s.symbol;
    panelTitle.textContent = s.cz.toUpperCase();
    panelSub.textContent = PERIOD_LABEL[currentPeriod];

    var cacheKey = currentPeriod + '|' + s.en + '|' + todayKey();

    // Every call gets its own sequence number. If a newer call starts before
    // this one's fetch resolves, its result is discarded instead of
    // overwriting whatever the newer call already rendered (this is what
    // caused the "shows briefly, then reverts to loading/error" symptom —
    // a slower, stale request finishing after a faster/newer one).
    var mySeq = ++requestSeq;

    if (cache[cacheKey]) {
      renderText(cache[cacheKey]);
      return;
    }

    panelBody.innerHTML = '<div class="horoscope-panel-loading">Čtu hvězdy…</div>';

    fetchHoroscopeText(currentPeriod, s.en)
      .then(function (text) {
        if (mySeq !== requestSeq) return; // a newer request has already taken over
        cache[cacheKey] = text;
        renderText(text);
      })
      .catch(function (err) {
        if (mySeq !== requestSeq) return; // a newer request has already taken over
        console.error('Horoskop se nepodařilo načíst ze žádného zdroje:', err);
        panelBody.innerHTML =
          '<div class="horoscope-panel-error">Hvězdy jsou dnes zamlžené — horoskop se nepodařilo načíst. Zkus to prosím za chvíli znovu.</div>';
      });
  }

  function parseFreeHoroscopeApi(res) {
    if (!res.ok) throw new Error('freehoroscopeapi bad response: ' + res.status);
    return res.json().then(function (data) {
      var text = data && data.data && data.data.horoscope;
      if (!text) throw new Error('freehoroscopeapi: no text in response');
      return text;
    });
  }

  function parseAztro(res) {
    if (!res.ok) throw new Error('aztro bad response: ' + res.status);
    return res.json().then(function (data) {
      var text = data && data.description;
      if (!text) throw new Error('aztro: no text in response');
      return text;
    });
  }

  function parseOhmanda(res) {
    if (!res.ok) throw new Error('ohmanda bad response: ' + res.status);
    return res.json().then(function (data) {
      var text = data && data.horoscope;
      // ohmanda sometimes returns an empty array instead of text when it's down
      if (!text || typeof text !== 'string') throw new Error('ohmanda: no text in response');
      return text;
    });
  }

  // corsproxy.io is the only outbound channel that actually reaches the
  // network in some browsers/networks (direct calls and other proxies get
  // silently blocked). So: prefer corsproxy.io, and route it to several
  // independent backends in turn — if one backend blocks proxy traffic
  // (e.g. a 403 from anti-bot protection), the next one is tried.
  function fetchHoroscopeText(period, sign) {
    var freehoroscopeUrl = 'https://freehoroscopeapi.com/api/v1/get-horoscope/' + period + '?sign=' + sign;
    var corsproxy = function (url) { return 'https://corsproxy.io/?url=' + encodeURIComponent(url); };

    var attempts = [
      // proven-working transport first, against each backend in turn
      function () { return fetch(corsproxy(freehoroscopeUrl)).then(parseFreeHoroscopeApi); }
    ];

    if (period === 'daily') {
      attempts.push(function () {
        return fetch(corsproxy('https://ohmanda.com/api/horoscope/' + sign + '/')).then(parseOhmanda);
      });
      attempts.push(function () {
        return fetch(corsproxy('https://aztro.sameerkumar.website/?sign=' + sign + '&day=today'), { method: 'POST' }).then(parseAztro);
      });
    }

    // last-resort: in case this browser/network isn't blocking these after all
    attempts.push(function () { return fetch(freehoroscopeUrl).then(parseFreeHoroscopeApi); });
    attempts.push(function () {
      return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(freehoroscopeUrl)).then(parseFreeHoroscopeApi);
    });

    return attempts.reduce(function (chain, attempt, i) {
      return chain.catch(function (err) {
        if (i > 0) console.warn('Zdroj horoskopu č. ' + i + ' selhal, zkouším další…', err);
        return attempt();
      });
    }, Promise.reject(new Error('start')));
  }


  function renderText(text) {
    panelBody.innerHTML =
      '<div class="horoscope-panel-text">' + text + '</div>' +
      '<div class="horoscope-panel-note">Text je zdrojován v angličtině z externí služby a aktualizuje se automaticky.</div>';
  }
})();
</script>
